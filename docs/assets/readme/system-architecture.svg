<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
  <title id="title">架构图：LLM 驱动的蛋白质设计工作流系统</title>
  <desc id="desc">依据设计文档展示输入层、智能规划层、执行层、安全汇总层、资源层与审计闭环。</desc>
  <defs>
    <pattern id="dots-green" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.05" fill="#a7d486" opacity="0.72"/>
    </pattern>
    <pattern id="dots-gray" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.0" fill="#b9bec6" opacity="0.62"/>
    </pattern>
    <pattern id="dots-blue" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2.3" cy="2.3" r="1.0" fill="#8ab5e8" opacity="0.36"/>
    </pattern>
    <marker id="arrow-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6fb23f"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c838d"/>
    </marker>
    <style>
      .h1 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 32px; font-weight: 800; fill: #111111; }
      .h2 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; font-weight: 800; fill: #111111; }
      .h3 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; font-weight: 750; fill: #111111; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; fill: #606873; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #111111; paint-order: stroke fill; stroke: #ffffff; stroke-width: 2.6px; stroke-linejoin: round; }
      .mono-small { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #404852; paint-order: stroke fill; stroke: #ffffff; stroke-width: 2.2px; stroke-linejoin: round; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 800; fill: #606873; letter-spacing: .8px; paint-order: stroke fill; stroke: #ffffff; stroke-width: 2px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="940" fill="#ffffff"/>
  <text x="52" y="62" class="h1">Layered architecture: planning suggestions, controlled execution, auditable recovery</text>
  <text x="54" y="92" class="small">The design keeps control-flow authority in Workflow/FSM while agents stay inside their role boundaries.</text>

  <rect x="610" y="132" width="280" height="74" rx="36" fill="#ffffff" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="610" y="132" width="280" height="74" rx="36" fill="url(#dots-green)" opacity="0.65"/>
  <text x="750" y="176" class="mono" text-anchor="middle">WORKFLOW / FSM</text>
  <text x="750" y="236" class="tag" text-anchor="middle">State authority</text>
  <path d="M750,206 L750,258" fill="none" stroke="#7c838d" stroke-width="2.1" marker-end="url(#arrow-gray)"/>

  <rect x="92" y="258" width="1316" height="436" rx="34" fill="#f7f8fa" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="92" y="258" width="1316" height="436" rx="34" fill="url(#dots-gray)" opacity="0.22"/>
  <text x="128" y="298" class="h2">Runtime kernel</text>

  <rect x="132" y="336" width="220" height="118" rx="15" fill="#eaf4ff" stroke="#2d333b" stroke-width="1.4"/>
  <rect x="132" y="336" width="220" height="118" rx="15" fill="url(#dots-blue)" opacity="0.12"/>
  <text x="150" y="364" class="h3">Interface layer</text>
  <text x="150" y="392" class="small">React workbench</text>
  <text x="150" y="412" class="small">CLI / scripts</text>
  <text x="150" y="432" class="small">TaskAPI</text>

  <rect x="396" y="336" width="220" height="118" rx="15" fill="#eff9f1" stroke="#2d333b" stroke-width="1.4"/>
  <rect x="396" y="336" width="220" height="118" rx="15" fill="url(#dots-blue)" opacity="0.12"/>
  <text x="414" y="364" class="h3">Contract layer</text>
  <text x="414" y="392" class="small">ProteinDesignTask</text>
  <text x="414" y="412" class="small">Plan / StepResult</text>
  <text x="414" y="432" class="small">schema validation</text>

  <rect x="660" y="336" width="220" height="118" rx="15" fill="#fff5df" stroke="#2d333b" stroke-width="1.4"/>
  <rect x="660" y="336" width="220" height="118" rx="15" fill="url(#dots-blue)" opacity="0.12"/>
  <text x="678" y="364" class="h3">Planner + KG</text>
  <text x="678" y="392" class="small">Top-K CandidateSet</text>
  <text x="678" y="412" class="small">ToolKG constraints</text>
  <text x="678" y="432" class="small">default suggestion</text>

  <rect x="924" y="336" width="220" height="118" rx="15" fill="#f5efff" stroke="#2d333b" stroke-width="1.4"/>
  <rect x="924" y="336" width="220" height="118" rx="15" fill="url(#dots-blue)" opacity="0.12"/>
  <text x="942" y="364" class="h3">Executor + Tools</text>
  <text x="942" y="392" class="small">PlanStep dispatch</text>
  <text x="942" y="412" class="small">ToolAdapter / REST</text>
  <text x="942" y="432" class="small">retry boundary</text>

  <rect x="1188" y="336" width="180" height="118" rx="15" fill="#fff1f1" stroke="#2d333b" stroke-width="1.4"/>
  <rect x="1188" y="336" width="180" height="118" rx="15" fill="url(#dots-blue)" opacity="0.12"/>
  <text x="1206" y="364" class="h3">Safety + Summary</text>
  <text x="1206" y="392" class="small">ok / warn / block</text>
  <text x="1206" y="412" class="small">DesignResult</text>
  <text x="1206" y="432" class="small">report</text>

  <path d="M352,394 L396,394" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <path d="M616,394 L660,394" fill="none" stroke="#7c838d" stroke-width="2.1" marker-end="url(#arrow-gray)"/>
  <path d="M880,394 L924,394" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <path d="M1144,394 L1188,394" fill="none" stroke="#7c838d" stroke-width="2.1" marker-end="url(#arrow-gray)"/>

  <text x="374" y="318" class="tag" text-anchor="middle">task</text>
  <text x="638" y="318" class="tag" text-anchor="middle">schema</text>
  <text x="902" y="318" class="tag" text-anchor="middle">plan</text>
  <text x="1166" y="318" class="tag" text-anchor="middle">result</text>

  <rect x="396" y="494" width="220" height="110" rx="15" fill="#ffffff" stroke="#2d333b" stroke-width="1.4"/>
  <rect x="396" y="494" width="220" height="110" rx="15" fill="url(#dots-blue)" opacity="0.12"/>
  <text x="414" y="522" class="h3">RuntimeState</text>
  <text x="414" y="550" class="small">p_success</text>
  <text x="414" y="570" class="small">p_structural_failure</text>
  <text x="414" y="590" class="small">recovery_margin</text>
  <text x="414" y="610" class="small">cost / evidence</text>

  <rect x="660" y="494" width="220" height="110" rx="15" fill="#ffffff" stroke="#2d333b" stroke-width="1.4"/>
  <rect x="660" y="494" width="220" height="110" rx="15" fill="url(#dots-blue)" opacity="0.12"/>
  <text x="678" y="522" class="h3">HITL gate</text>
  <text x="678" y="550" class="small">PendingAction</text>
  <text x="678" y="570" class="small">Decision</text>
  <text x="678" y="590" class="small">WAITING_* pause</text>

  <rect x="924" y="494" width="220" height="110" rx="15" fill="#ffffff" stroke="#2d333b" stroke-width="1.4"/>
  <rect x="924" y="494" width="220" height="110" rx="15" fill="url(#dots-blue)" opacity="0.12"/>
  <text x="942" y="522" class="h3">Audit store</text>
  <text x="942" y="550" class="small">TaskSnapshot</text>
  <text x="942" y="570" class="small">EventLog</text>
  <text x="942" y="590" class="small">artifacts / reports</text>

  <path d="M750,454 L750,494" fill="none" stroke="#7c838d" stroke-width="2.1" marker-end="url(#arrow-gray)"/>
  <text x="750" y="480" class="small" text-anchor="middle">pause before decision</text>

  <path d="M616,548 L660,548" fill="none" stroke="#7c838d" stroke-width="2.1" marker-end="url(#arrow-gray)"/>
  <text x="638" y="534" class="small" text-anchor="middle">context</text>

  <path d="M880,548 L924,548" fill="none" stroke="#7c838d" stroke-width="2.1" marker-end="url(#arrow-gray)"/>
  <text x="902" y="534" class="small" text-anchor="middle">write-ahead</text>

  <rect x="180" y="762" width="1140" height="76" rx="32" fill="#fbfff7" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="180" y="762" width="1140" height="76" rx="32" fill="url(#dots-green)" opacity="0.36"/>
  <text x="750" y="794" class="h3" text-anchor="middle">Recovery and observability rail</text>
  <text x="750" y="816" class="mono-small" text-anchor="middle">retry -&gt; patch -&gt; replan</text>
  <text x="750" y="832" class="mono-small" text-anchor="middle">PendingAction -&gt; Decision -&gt; EventLog -&gt; TaskSnapshot</text>

  <path d="M1204,762 L880,604" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)" stroke-dasharray="7 7"/>
  <text x="1110" y="706" class="mono-green" text-anchor="middle">recover from latest snapshot</text>

  <path d="M660,762 L616,604" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)" stroke-dasharray="7 7"/>
  <text x="614" y="722" class="mono-green" text-anchor="middle">runtime summary</text>

  <text x="134" y="246" class="mono-small">Design source: architecture.md / system-implementation-design.md</text>
  <text x="1020" y="246" class="mono-small">Control-flow SSOT stays in Workflow/FSM;</text>
  <text x="1020" y="262" class="mono-small">Nextflow is only a PlanStep backend.</text>
</svg>

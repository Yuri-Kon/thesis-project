<rect x="930" y="790" width="404" height="86" rx="28" fill="url(#dots-green)" opacity="0.28"/>
<text x="1132" y="824" class="h3" text-anchor="middle">Invariant highlighted by design docs</text>
<text x="1132" y="850" class="mono-small" text-anchor="middle">Planner suggests; Workflow mutates state; Executor runs tools; Human approves.</text>
</svg>

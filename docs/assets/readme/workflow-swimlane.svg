<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">泳道图：任务生命周期与组件职责</title>
  <desc id="desc">展示 API、Workflow/FSM、Planner、Executor、Safety、Storage、Human 在任务阶段中的职责边界。</desc>
  <defs>
    <pattern id="dots-green" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.05" fill="#a7d486" opacity="0.72"/>
    </pattern>
    <pattern id="dots-gray" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.0" fill="#b9bec6" opacity="0.62"/>
    </pattern>
    <pattern id="dots-blue" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2.3" cy="2.3" r="1.0" fill="#8ab5e8" opacity="0.36"/>
    </pattern>
    <marker id="arrow-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6fb23f"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c838d"/>
    </marker>
    <style>
      .h1 { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111111; }
      .h2 { font: 800 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111111; }
      .h3 { font: 750 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111111; }
      .body { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #252c35; }
      .small { font: 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #606873; }
      .mono { font: 14px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #111111; }
      .mono-green { font: 15px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #275f13; }
      .mono-small { font: 12px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #404852; }
      .lane { font: 800 13px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #111111; }
      .tag { font: 800 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #606873; letter-spacing: .8px; }
    </style>
  </defs>
  <rect x="0" y="0" width="1500" height="980" fill="#ffffff"/>
<text x="52" y="66" class="h1" text-anchor="start">Swimlane: task lifecycle, agent boundaries, and HITL checkpoints</text>
<text x="54" y="100" class="small" text-anchor="start">Rows show ownership; columns show lifecycle stages. WAITING_* rows stop execution until a Decision arrives.</text>
<rect x="62" y="106" width="1376" height="56" rx="20" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.45"/>
<rect x="62" y="106" width="1376" height="56" rx="20" fill="url(#dots-gray)" opacity="0.18"/>
<text x="295" y="140" class="tag" text-anchor="middle">INTAKE</text>
<path d="M210,106 L210,762" stroke="#c9cdd3" stroke-width="1.2"/>
<text x="475" y="140" class="tag" text-anchor="middle">PLAN</text>
<path d="M380,106 L380,762" stroke="#c9cdd3" stroke-width="1.2"/>
<text x="675" y="140" class="tag" text-anchor="middle">EXECUTE</text>
<path d="M570,106 L570,762" stroke="#c9cdd3" stroke-width="1.2"/>
<text x="915" y="140" class="tag" text-anchor="middle">RECOVER</text>
<path d="M780,106 L780,762" stroke="#c9cdd3" stroke-width="1.2"/>
<text x="1140" y="140" class="tag" text-anchor="middle">SUMMARIZE</text>
<path d="M1050,106 L1050,762" stroke="#c9cdd3" stroke-width="1.2"/>
<text x="1335" y="140" class="tag" text-anchor="middle">AUDIT</text>
<path d="M1230,106 L1230,762" stroke="#c9cdd3" stroke-width="1.2"/>
<path d="M1440,106 L1440,762" stroke="#c9cdd3" stroke-width="1.2"/>
<rect x="62" y="160" width="1376" height="86" rx="0" fill="#fbfff7" stroke="#c9cdd3" stroke-width="1.45"/>
<rect x="62" y="160" width="1376" height="86" rx="0" fill="url(#dots-green)" opacity="0.12"/>
<text x="90" y="212" class="lane" text-anchor="start">Human / UI</text>
<rect x="62" y="246" width="1376" height="86" rx="0" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.45"/>

<text x="90" y="298" class="lane" text-anchor="start">TaskAPI</text>
<rect x="62" y="332" width="1376" height="86" rx="0" fill="#fbfff7" stroke="#c9cdd3" stroke-width="1.45"/>
<rect x="62" y="332" width="1376" height="86" rx="0" fill="url(#dots-green)" opacity="0.12"/>
<text x="90" y="384" class="lane" text-anchor="start">Workflow / FSM</text>
<rect x="62" y="418" width="1376" height="86" rx="0" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.45"/>

<text x="90" y="470" class="lane" text-anchor="start">PlannerAgent</text>
<rect x="62" y="504" width="1376" height="86" rx="0" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.45"/>

<text x="90" y="556" class="lane" text-anchor="start">Executor / Tools</text>
<rect x="62" y="590" width="1376" height="86" rx="0" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.45"/>

<text x="90" y="642" class="lane" text-anchor="start">SafetyAgent</text>
<rect x="62" y="676" width="1376" height="86" rx="0" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.45"/>

<text x="90" y="728" class="lane" text-anchor="start">Storage / Log</text>
<rect x="224" y="176" width="142" height="42" rx="18" fill="#ffffff" stroke="#6fb23f" stroke-width="1.45"/>
<rect x="224" y="176" width="142" height="42" rx="18" fill="url(#dots-green)" opacity="0.26"/>
<text x="295" y="202" class="mono-small" text-anchor="middle">submit goal</text>
<rect x="228" y="262" width="136" height="42" rx="18" fill="#ffffff" stroke="#7c838d" stroke-width="1.45"/>
<rect x="228" y="262" width="136" height="42" rx="18" fill="url(#dots-gray)" opacity="0.26"/>
<text x="296" y="288" class="mono-small" text-anchor="middle">create task</text>

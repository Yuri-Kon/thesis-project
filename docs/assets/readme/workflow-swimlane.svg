<rect x="1014" y="176" width="182" height="42" rx="18" fill="url(#dots-green)" opacity="0.26"/>
<text x="1105" y="202" class="mono-small" text-anchor="middle">approve Decision</text>
<rect x="1218" y="348" width="150" height="42" rx="18" fill="#ffffff" stroke="#6fb23f" stroke-width="1.45"/>
<rect x="1218" y="348" width="150" height="42" rx="18" fill="url(#dots-green)" opacity="0.26"/>
<text x="1293" y="374" class="mono-small" text-anchor="middle">SUMMARIZING</text>
<rect x="1216" y="606" width="154" height="42" rx="18" fill="#ffffff" stroke="#7c838d" stroke-width="1.45"/>
<rect x="1216" y="606" width="154" height="42" rx="18" fill="url(#dots-gray)" opacity="0.26"/>
<text x="1293" y="632" class="mono-small" text-anchor="middle">final safety</text>
<rect x="1220" y="692" width="150" height="42" rx="18" fill="#ffffff" stroke="#7c838d" stroke-width="1.45"/>
<rect x="1220" y="692" width="150" height="42" rx="18" fill="url(#dots-gray)" opacity="0.26"/>
<text x="1295" y="718" class="mono-small" text-anchor="middle">EventLog + Snapshot</text>

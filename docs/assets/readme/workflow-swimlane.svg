<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">泳道图：任务生命周期与组件职责</title>
  <desc id="desc">展示 API、Workflow/FSM、Planner、Executor、Safety、Storage、Human 在任务阶段中的职责边界。</desc>
  <defs>
    <pattern id="dots-green" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.05" fill="#a7d486" opacity="0.72"/>
    </pattern>
    <pattern id="dots-gray" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.0" fill="#b9bec6" opacity="0.62"/>
    </pattern>
    <pattern id="dots-blue" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2.3" cy="2.3" r="1.0" fill="#8ab5e8" opacity="0.36"/>
    </pattern>
    <marker id="arrow-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6fb23f"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c838d"/>
    </marker>
    <style>
      .h1 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 32px; font-weight: 800; fill: #111111; }
      .h2 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; font-weight: 800; fill: #111111; }
      .h3 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; font-weight: 750; fill: #111111; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; fill: #252c35; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; fill: #606873; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #111111; paint-order: stroke fill; stroke: #ffffff; stroke-width: 2.6px; stroke-linejoin: round; }
      .mono-green { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 12.5px; fill: #275f13; paint-order: stroke fill; stroke: #ffffff; stroke-width: 2.6px; stroke-linejoin: round; }
      .mono-small { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #404852; paint-order: stroke fill; stroke: #ffffff; stroke-width: 2.2px; stroke-linejoin: round; }
      .lane { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 12.5px; font-weight: 800; fill: #111111; paint-order: stroke fill; stroke: #ffffff; stroke-width: 2.3px; stroke-linejoin: round; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 800; fill: #606873; letter-spacing: .8px; paint-order: stroke fill; stroke: #ffffff; stroke-width: 2px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="0" y="0" width="1500" height="920" fill="#ffffff"/>

  <text x="52" y="62" class="h1">Swimlane: task lifecycle, agent boundaries, and HITL checkpoints</text>
  <text x="54" y="92" class="small">Rows show ownership; columns show lifecycle stages. WAITING_* rows stop execution until a Decision arrives.</text>

  <rect x="92" y="118" width="1316" height="52" rx="18" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.4"/>
  <rect x="92" y="118" width="1316" height="52" rx="18" fill="url(#dots-gray)" opacity="0.18"/>
  <text x="282" y="150" class="tag" text-anchor="middle">INTAKE</text>
  <text x="494" y="150" class="tag" text-anchor="middle">PLAN</text>
  <text x="706" y="150" class="tag" text-anchor="middle">EXECUTE</text>
  <text x="918" y="150" class="tag" text-anchor="middle">RECOVER</text>
  <text x="1130" y="150" class="tag" text-anchor="middle">SUMMARIZE</text>
  <text x="1342" y="150" class="tag" text-anchor="middle">AUDIT</text>

  <path d="M281,118 L281,740" stroke="#c9cdd3" stroke-width="1.1"/>
  <path d="M493,118 L493,740" stroke="#c9cdd3" stroke-width="1.1"/>
  <path d="M705,118 L705,740" stroke="#c9cdd3" stroke-width="1.1"/>
  <path d="M917,118 L917,740" stroke="#c9cdd3" stroke-width="1.1"/>
  <path d="M1129,118 L1129,740" stroke="#c9cdd3" stroke-width="1.1"/>
  <path d="M1341,118 L1341,740" stroke="#c9cdd3" stroke-width="1.1"/>

  <rect x="92" y="170" width="1316" height="86" fill="#fbfff7" stroke="#c9cdd3" stroke-width="1.4"/>
  <rect x="92" y="170" width="1316" height="86" fill="url(#dots-green)" opacity="0.12"/>
  <rect x="92" y="256" width="1316" height="86" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.4"/>
  <rect x="92" y="342" width="1316" height="86" fill="#fbfff7" stroke="#c9cdd3" stroke-width="1.4"/>
  <rect x="92" y="342" width="1316" height="86" fill="url(#dots-green)" opacity="0.12"/>
  <rect x="92" y="428" width="1316" height="86" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.4"/>
  <rect x="92" y="514" width="1316" height="86" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.4"/>
  <rect x="92" y="600" width="1316" height="86" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.4"/>
  <rect x="92" y="686" width="1316" height="86" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.4"/>

  <text x="118" y="222" class="lane">Human / UI</text>
  <text x="118" y="308" class="lane">TaskAPI</text>
  <text x="118" y="394" class="lane">Workflow / FSM</text>
  <text x="118" y="480" class="lane">PlannerAgent</text>
  <text x="118" y="566" class="lane">Executor / Tools</text>
  <text x="118" y="652" class="lane">SafetyAgent</text>
  <text x="118" y="738" class="lane">Storage / Log</text>

  <rect x="212" y="192" width="150" height="40" rx="16" fill="#ffffff" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="212" y="192" width="150" height="40" rx="16" fill="url(#dots-green)" opacity="0.22"/>
  <text x="287" y="217" class="mono-small" text-anchor="middle">submit goal</text>

  <rect x="424" y="278" width="150" height="40" rx="16" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="424" y="278" width="150" height="40" rx="16" fill="url(#dots-gray)" opacity="0.22"/>
  <text x="499" y="303" class="mono-small" text-anchor="middle">create task</text>

  <rect x="424" y="364" width="170" height="40" rx="16" fill="#ffffff" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="424" y="364" width="170" height="40" rx="16" fill="url(#dots-green)" opacity="0.22"/>
  <text x="509" y="389" class="mono-small" text-anchor="middle">CREATED -&gt; PLANNING</text>

  <rect x="636" y="364" width="170" height="40" rx="16" fill="#ffffff" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="636" y="364" width="170" height="40" rx="16" fill="url(#dots-green)" opacity="0.22"/>
  <text x="721" y="389" class="mono-small" text-anchor="middle">WAITING_PLAN_CONFIRM</text>

  <rect x="636" y="450" width="170" height="40" rx="16" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="636" y="450" width="170" height="40" rx="16" fill="url(#dots-gray)" opacity="0.22"/>
  <text x="721" y="475" class="mono-small" text-anchor="middle">Top-K candidates</text>

  <rect x="636" y="278" width="150" height="40" rx="16" fill="#ffffff" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="636" y="278" width="150" height="40" rx="16" fill="url(#dots-green)" opacity="0.22"/>
  <text x="711" y="303" class="mono-small" text-anchor="middle">review plan</text>

  <rect x="848" y="364" width="140" height="40" rx="16" fill="#ffffff" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="848" y="364" width="140" height="40" rx="16" fill="url(#dots-green)" opacity="0.22"/>
  <text x="918" y="389" class="mono-small" text-anchor="middle">RUNNING</text>

  <rect x="848" y="450" width="160" height="40" rx="16" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="848" y="450" width="160" height="40" rx="16" fill="url(#dots-gray)" opacity="0.22"/>
  <text x="928" y="475" class="mono-small" text-anchor="middle">patch / replan</text>

  <rect x="848" y="278" width="150" height="40" rx="16" fill="#ffffff" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="848" y="278" width="150" height="40" rx="16" fill="url(#dots-green)" opacity="0.22"/>
  <text x="923" y="303" class="mono-small" text-anchor="middle">run PlanStep</text>

  <rect x="1060" y="364" width="156" height="40" rx="16" fill="#ffffff" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="1060" y="364" width="156" height="40" rx="16" fill="url(#dots-green)" opacity="0.22"/>
  <text x="1138" y="389" class="mono-small" text-anchor="middle">SUMMARIZING</text>

  <rect x="1060" y="278" width="170" height="40" rx="16" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="1060" y="278" width="170" height="40" rx="16" fill="url(#dots-gray)" opacity="0.22"/>
  <text x="1145" y="303" class="mono-small" text-anchor="middle">final safety check</text>

  <rect x="1272" y="364" width="110" height="40" rx="16" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="1272" y="364" width="110" height="40" rx="16" fill="url(#dots-gray)" opacity="0.22"/>
  <text x="1327" y="389" class="mono-small" text-anchor="middle">EventLog</text>

  <rect x="1272" y="450" width="110" height="40" rx="16" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="1272" y="450" width="110" height="40" rx="16" fill="url(#dots-gray)" opacity="0.22"/>
  <text x="1327" y="475" class="mono-small" text-anchor="middle">Snapshot</text>

  <rect x="212" y="720" width="150" height="40" rx="16" fill="#ffffff" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="212" y="720" width="150" height="40" rx="16" fill="url(#dots-green)" opacity="0.22"/>
  <text x="287" y="745" class="mono-small" text-anchor="middle">read summary</text>

  <rect x="424" y="720" width="190" height="40" rx="16" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="424" y="720" width="190" height="40" rx="16" fill="url(#dots-gray)" opacity="0.22"/>
  <text x="519" y="745" class="mono-small" text-anchor="middle">TaskSnapshot / EventLog</text>

  <rect x="636" y="720" width="170" height="40" rx="16" fill="#ffffff" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="636" y="720" width="170" height="40" rx="16" fill="url(#dots-green)" opacity="0.22"/>
  <text x="721" y="745" class="mono-small" text-anchor="middle">Decision approval</text>

  <rect x="848" y="720" width="170" height="40" rx="16" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="848" y="720" width="170" height="40" rx="16" fill="url(#dots-gray)" opacity="0.22"/>
  <text x="933" y="745" class="mono-small" text-anchor="middle">write snapshot</text>

  <path d="M362,212 L424,298" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <path d="M574,298 L636,298" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <path d="M806,389 L848,389" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <path d="M996,389 L1060,389" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <path d="M1210,389 L1272,389" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <path d="M1210,475 L1272,475" fill="none" stroke="#7c838d" stroke-width="2.1" marker-end="url(#arrow-gray)"/>
  <path d="M996,475 L1060,303" fill="none" stroke="#7c838d" stroke-width="2.1" marker-end="url(#arrow-gray)" stroke-dasharray="7 7"/>
  <path d="M806,475 L848,389" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)" stroke-dasharray="7 7"/>
  <path d="M996,303 L1060,303" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>

  <rect x="92" y="790" width="1316" height="82" rx="20" fill="#fbfff7" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="92" y="790" width="1316" height="82" rx="20" fill="url(#dots-green)" opacity="0.22"/>
  <text x="118" y="822" class="h3">Invariant highlighted by design docs</text>
  <text x="118" y="846" class="mono-small">Planner suggests; Workflow mutates state; Executor runs tools; Human approves.</text>
  <text x="118" y="866" class="mono-small">WAITING_* gates are persisted before the user sees the decision.</text>
</svg>

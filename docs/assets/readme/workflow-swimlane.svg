<rect x="800" y="348" width="140" height="42" rx="18" fill="url(#dots-green)" opacity="0.26"/>
<text x="870" y="374" class="mono-small" text-anchor="middle">RUNNING</text>
<rect x="800" y="520" width="142" height="42" rx="18" fill="#ffffff" stroke="#7c838d" stroke-width="1.45"/>
<rect x="800" y="520" width="142" height="42" rx="18" fill="url(#dots-gray)" opacity="0.26"/>
<text x="871" y="546" class="mono-small" text-anchor="middle">run PlanStep</text>
<rect x="812" y="606" width="120" height="42" rx="18" fill="#ffffff" stroke="#7c838d" stroke-width="1.45"/>
<rect x="812" y="606" width="120" height="42" rx="18" fill="url(#dots-gray)" opacity="0.26"/>
<text x="872" y="632" class="mono-small" text-anchor="middle">check step</text>
<rect x="1016" y="348" width="176" height="42" rx="18" fill="#ffffff" stroke="#6fb23f" stroke-width="1.45"/>
<rect x="1016" y="348" width="176" height="42" rx="18" fill="url(#dots-green)" opacity="0.26"/>
<text x="1104" y="374" class="mono-small" text-anchor="middle">WAITING_PATCH / REPLAN</text>
<rect x="1010" y="434" width="188" height="42" rx="18" fill="#ffffff" stroke="#7c838d" stroke-width="1.45"/>
<rect x="1010" y="434" width="188" height="42" rx="18" fill="url(#dots-gray)" opacity="0.26"/>

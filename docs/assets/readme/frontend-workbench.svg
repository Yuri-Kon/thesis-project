<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-labelledby="title desc">
  <title id="title">前端工作台：决策上下文同屏</title>
  <desc id="desc">展示 Web workspace 如何通过正式 API 呈现任务、待办、候选、事件和报告。</desc>
  <defs>
    <pattern id="dots-green" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.05" fill="#a7d486" opacity="0.72"/>
    </pattern>
    <pattern id="dots-gray" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.0" fill="#b9bec6" opacity="0.62"/>
    </pattern>
    <pattern id="dots-blue" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2.3" cy="2.3" r="1.0" fill="#8ab5e8" opacity="0.36"/>
    </pattern>
    <marker id="arrow-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6fb23f"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c838d"/>
    </marker>
    <style>
      .h1 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 32px; font-weight: 800; fill: #111111; }
      .h2 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; font-weight: 800; fill: #111111; }
      .h3 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; font-weight: 750; fill: #111111; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; fill: #606873; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #111111; paint-order: stroke fill; stroke: #ffffff; stroke-width: 2.6px; stroke-linejoin: round; }
      .mono-small { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #404852; paint-order: stroke fill; stroke: #ffffff; stroke-width: 2.2px; stroke-linejoin: round; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 800; fill: #606873; letter-spacing: .8px; paint-order: stroke fill; stroke: #ffffff; stroke-width: 2px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="840" fill="#ffffff"/>
  <text x="52" y="62" class="h1">Workbench view: API-backed task review, not a second workflow engine</text>
  <text x="54" y="92" class="small">The browser never mutates FSM directly; it reads server state and submits Decision requests.</text>

  <rect x="96" y="162" width="1308" height="250" rx="36" fill="#f7f8fa" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="96" y="162" width="1308" height="250" rx="36" fill="url(#dots-gray)" opacity="0.2"/>
  <text x="126" y="198" class="h2">Browser workspace</text>

  <rect x="132" y="220" width="222" height="124" rx="15" fill="#ffffff" stroke="#2d333b" stroke-width="1.4"/>
  <rect x="132" y="220" width="222" height="124" rx="15" fill="url(#dots-blue)" opacity="0.12"/>
  <text x="150" y="250" class="h3">Task Builder</text>
  <text x="150" y="278" class="small">field registry</text>
  <text x="150" y="298" class="small">extraction / precheck</text>

  <rect x="392" y="220" width="222" height="124" rx="15" fill="#ffffff" stroke="#2d333b" stroke-width="1.4"/>
  <rect x="392" y="220" width="222" height="124" rx="15" fill="url(#dots-blue)" opacity="0.12"/>
  <text x="410" y="250" class="h3">Dashboard</text>
  <text x="410" y="278" class="small">task scan / pending entry</text>
  <text x="410" y="298" class="small">readiness</text>

  <rect x="652" y="220" width="222" height="124" rx="15" fill="#ffffff" stroke="#2d333b" stroke-width="1.4"/>
  <rect x="652" y="220" width="222" height="124" rx="15" fill="url(#dots-blue)" opacity="0.12"/>
  <text x="670" y="250" class="h3">Task Detail</text>
  <text x="670" y="278" class="small">status / artifacts</text>
  <text x="670" y="298" class="small">runtime summary</text>

  <rect x="912" y="220" width="222" height="124" rx="15" fill="#ffffff" stroke="#2d333b" stroke-width="1.4"/>
  <rect x="912" y="220" width="222" height="124" rx="15" fill="url(#dots-blue)" opacity="0.12"/>
  <text x="930" y="250" class="h3">Pending Review</text>
  <text x="930" y="278" class="small">candidate comparison</text>
  <text x="930" y="298" class="small">DecisionForm</text>

  <rect x="1172" y="220" width="198" height="124" rx="15" fill="#ffffff" stroke="#2d333b" stroke-width="1.4"/>
  <rect x="1172" y="220" width="198" height="124" rx="15" fill="url(#dots-blue)" opacity="0.12"/>
  <text x="1190" y="250" class="h3">Timeline</text>
  <text x="1190" y="278" class="small">EventLog</text>
  <text x="1190" y="298" class="small">recovery trace / reports</text>

  <path d="M354,282 L392,282" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <path d="M614,282 L652,282" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <path d="M874,282 L912,282" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <path d="M1134,282 L1172,282" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>

  <text x="373" y="268" class="small" text-anchor="middle">open</text>
  <text x="633" y="268" class="small" text-anchor="middle">inspect</text>
  <text x="893" y="268" class="small" text-anchor="middle">decide</text>
  <text x="1153" y="268" class="small" text-anchor="middle">audit</text>

  <rect x="208" y="460" width="1084" height="148" rx="30" fill="#fbfff7" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="208" y="460" width="1084" height="148" rx="30" fill="url(#dots-green)" opacity="0.28"/>
  <text x="750" y="492" class="h3" text-anchor="middle">Formal API surface</text>

  <rect x="252" y="514" width="206" height="64" rx="15" fill="#ffffff" stroke="#2d333b" stroke-width="1.4"/>
  <rect x="252" y="514" width="206" height="64" rx="15" fill="url(#dots-blue)" opacity="0.12"/>
  <text x="270" y="540" class="mono">GET /tasks/{id}</text>
  <text x="270" y="560" class="small">TaskRecord, status, steps</text>

  <rect x="514" y="514" width="206" height="64" rx="15" fill="#ffffff" stroke="#2d333b" stroke-width="1.4"/>
  <rect x="514" y="514" width="206" height="64" rx="15" fill="url(#dots-blue)" opacity="0.12"/>
  <text x="532" y="540" class="mono">GET /pending-actions</text>
  <text x="532" y="560" class="small">PendingAction candidates</text>

  <rect x="776" y="514" width="206" height="64" rx="15" fill="#ffffff" stroke="#2d333b" stroke-width="1.4"/>
  <rect x="776" y="514" width="206" height="64" rx="15" fill="url(#dots-blue)" opacity="0.12"/>
  <text x="794" y="540" class="mono">POST Decision</text>
  <text x="794" y="560" class="small">selected candidate, comment</text>

  <rect x="1038" y="514" width="206" height="64" rx="15" fill="#ffffff" stroke="#2d333b" stroke-width="1.4"/>
  <rect x="1038" y="514" width="206" height="64" rx="15" fill="url(#dots-blue)" opacity="0.12"/>
  <text x="1056" y="540" class="mono">GET /events</text>
  <text x="1056" y="560" class="small">EventLog + report metadata</text>

  <path d="M750,460 L956,404" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)" stroke-dasharray="7 7"/>
  <text x="908" y="430" class="mono-small" text-anchor="middle">server refresh after Decision</text>

  <rect x="160" y="656" width="1180" height="94" rx="24" fill="#ffffff" stroke="#c9cdd3" stroke-width="1.4"/>
  <rect x="160" y="656" width="1180" height="94" rx="24" fill="url(#dots-gray)" opacity="0.14"/>
  <text x="190" y="688" class="h3">Key behavior</text>
  <text x="190" y="712" class="small">The browser is a view and decision surface only. It displays server state, but the workflow stays authoritative.</text>
  <text x="190" y="732" class="small">PendingAction, Decision, EventLog, and TaskSnapshot all come from the backend API contract.</text>
</svg>

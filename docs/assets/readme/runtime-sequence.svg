<text x="86" y="1010" class="mono-small" text-anchor="start">WAITING_* gates are persisted before the user sees the decision.</text>
<text x="816" y="1010" class="mono-small" text-anchor="start">Safety block maps to WAITING_REPLAN_CONFIRM, not hidden execution.</text>

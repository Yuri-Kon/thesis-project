<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1140" viewBox="0 0 1500 1140" role="img" aria-labelledby="title desc">
  <title id="title">时序图：端到端执行与恢复闭环</title>
  <desc id="desc">展示 User、TaskAPI、Workflow、Planner、ToolKG、Executor、ToolAdapter、Safety、Storage 之间的端到端消息。</desc>
  <defs>
    <pattern id="dots-green" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.05" fill="#a7d486" opacity="0.72"/>
    </pattern>
    <pattern id="dots-gray" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.0" fill="#b9bec6" opacity="0.62"/>
    </pattern>
    <marker id="arrow-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6fb23f"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c838d"/>
    </marker>
    <style>
      .h1 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 32px; font-weight: 800; fill: #111111; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; fill: #606873; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #111111; paint-order: stroke fill; stroke: #ffffff; stroke-width: 2.6px; stroke-linejoin: round; }
      .mono-green { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 12.5px; fill: #275f13; paint-order: stroke fill; stroke: #ffffff; stroke-width: 2.6px; stroke-linejoin: round; }
      .mono-small { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #404852; paint-order: stroke fill; stroke: #ffffff; stroke-width: 2.2px; stroke-linejoin: round; }
      .lane { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 12.5px; font-weight: 800; fill: #111111; paint-order: stroke fill; stroke: #ffffff; stroke-width: 2.3px; stroke-linejoin: round; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 800; fill: #606873; letter-spacing: .8px; paint-order: stroke fill; stroke: #ffffff; stroke-width: 2px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="1140" fill="#ffffff"/>
  <text x="52" y="62" class="h1">Sequence: end-to-end planning, execution, and recovery loop</text>
  <text x="54" y="92" class="small">Labels stay offset from lifelines and arrows so the flow remains readable at document scale.</text>

  <rect x="46" y="126" width="144" height="54" rx="27" fill="#ffffff" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="46" y="126" width="144" height="54" rx="27" fill="url(#dots-green)" opacity="0.65"/>
  <text x="118" y="158" class="mono-small" text-anchor="middle">USER</text>
  <path d="M118,180 L118,1030" stroke="#c9cdd3" stroke-width="1.6"/>
  <rect x="46" y="1036" width="144" height="50" rx="25" fill="#ffffff" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="46" y="1036" width="144" height="50" rx="25" fill="url(#dots-green)" opacity="0.65"/>
  <text x="118" y="1066" class="mono-small" text-anchor="middle">USER</text>

  <rect x="210" y="126" width="144" height="54" rx="27" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="210" y="126" width="144" height="54" rx="27" fill="url(#dots-gray)" opacity="0.65"/>
  <text x="282" y="158" class="mono-small" text-anchor="middle">TASK API</text>
  <path d="M282,180 L282,1030" stroke="#c9cdd3" stroke-width="1.6"/>
  <rect x="210" y="1036" width="144" height="50" rx="25" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="210" y="1036" width="144" height="50" rx="25" fill="url(#dots-gray)" opacity="0.65"/>
  <text x="282" y="1066" class="mono-small" text-anchor="middle">TASK API</text>

  <rect x="384" y="126" width="144" height="54" rx="27" fill="#ffffff" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="384" y="126" width="144" height="54" rx="27" fill="url(#dots-green)" opacity="0.65"/>
  <text x="456" y="158" class="mono-small" text-anchor="middle">WORKFLOW</text>
  <path d="M456,180 L456,1030" stroke="#c9cdd3" stroke-width="1.6"/>
  <rect x="384" y="1036" width="144" height="50" rx="25" fill="#ffffff" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="384" y="1036" width="144" height="50" rx="25" fill="url(#dots-green)" opacity="0.65"/>
  <text x="456" y="1066" class="mono-small" text-anchor="middle">WORKFLOW</text>

  <rect x="568" y="126" width="144" height="54" rx="27" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="568" y="126" width="144" height="54" rx="27" fill="url(#dots-gray)" opacity="0.65"/>
  <text x="640" y="158" class="mono-small" text-anchor="middle">PLANNER</text>
  <path d="M640,180 L640,1030" stroke="#c9cdd3" stroke-width="1.6"/>
  <rect x="568" y="1036" width="144" height="50" rx="25" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="568" y="1036" width="144" height="50" rx="25" fill="url(#dots-gray)" opacity="0.65"/>
  <text x="640" y="1066" class="mono-small" text-anchor="middle">PLANNER</text>

  <rect x="744" y="126" width="144" height="54" rx="27" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="744" y="126" width="144" height="54" rx="27" fill="url(#dots-gray)" opacity="0.65"/>
  <text x="816" y="158" class="mono-small" text-anchor="middle">TOOL KG</text>
  <path d="M816,180 L816,1030" stroke="#c9cdd3" stroke-width="1.6"/>
  <rect x="744" y="1036" width="144" height="50" rx="25" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="744" y="1036" width="144" height="50" rx="25" fill="url(#dots-gray)" opacity="0.65"/>
  <text x="816" y="1066" class="mono-small" text-anchor="middle">TOOL KG</text>

  <rect x="922" y="126" width="144" height="54" rx="27" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="922" y="126" width="144" height="54" rx="27" fill="url(#dots-gray)" opacity="0.65"/>
  <text x="994" y="158" class="mono-small" text-anchor="middle">EXECUTOR</text>
  <path d="M994,180 L994,1030" stroke="#c9cdd3" stroke-width="1.6"/>
  <rect x="922" y="1036" width="144" height="50" rx="25" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="922" y="1036" width="144" height="50" rx="25" fill="url(#dots-gray)" opacity="0.65"/>
  <text x="994" y="1066" class="mono-small" text-anchor="middle">EXECUTOR</text>

  <rect x="1102" y="126" width="144" height="54" rx="27" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="1102" y="126" width="144" height="54" rx="27" fill="url(#dots-gray)" opacity="0.65"/>
  <text x="1174" y="158" class="mono-small" text-anchor="middle">TOOL ADAPTER</text>
  <path d="M1174,180 L1174,1030" stroke="#c9cdd3" stroke-width="1.6"/>
  <rect x="1102" y="1036" width="144" height="50" rx="25" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="1102" y="1036" width="144" height="50" rx="25" fill="url(#dots-gray)" opacity="0.65"/>
  <text x="1174" y="1066" class="mono-small" text-anchor="middle">TOOL ADAPTER</text>

  <rect x="1268" y="126" width="144" height="54" rx="27" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="1268" y="126" width="144" height="54" rx="27" fill="url(#dots-gray)" opacity="0.65"/>
  <text x="1340" y="158" class="mono-small" text-anchor="middle">SAFETY / STORE</text>
  <path d="M1340,180 L1340,1030" stroke="#c9cdd3" stroke-width="1.6"/>
  <rect x="1268" y="1036" width="144" height="50" rx="25" fill="#ffffff" stroke="#7c838d" stroke-width="1.4"/>
  <rect x="1268" y="1036" width="144" height="50" rx="25" fill="url(#dots-gray)" opacity="0.65"/>
  <text x="1340" y="1066" class="mono-small" text-anchor="middle">SAFETY / STORE</text>

  <path d="M136,232 L264,232" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <text x="200" y="206" class="mono-green" text-anchor="middle">
    <tspan x="200" dy="0">natural-language</tspan>
    <tspan x="200" dy="16">goal</tspan>
  </text>

  <path d="M300,290 L438,290" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <text x="369" y="264" class="mono-green" text-anchor="middle">create task</text>

  <path d="M474,350 L622,350" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <text x="548" y="324" class="mono-green" text-anchor="middle">
    <tspan x="548" dy="0">request Top-K</tspan>
    <tspan x="548" dy="16">candidates</tspan>
  </text>

  <path d="M658,410 L798,410" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <text x="728" y="384" class="mono-green" text-anchor="middle">
    <tspan x="728" dy="0">query ToolKG</tspan>
    <tspan x="728" dy="16">constraints</tspan>
  </text>

  <path d="M798,470 L658,470" fill="none" stroke="#7c838d" stroke-width="2.1" marker-end="url(#arrow-gray)"/>
  <text x="728" y="444" class="mono-small" text-anchor="middle">
    <tspan x="728" dy="0">tool schemas /</tspan>
    <tspan x="728" dy="16">cost / risk</tspan>
  </text>

  <path d="M622,530 L474,530" fill="none" stroke="#7c838d" stroke-width="2.1" marker-end="url(#arrow-gray)"/>
  <text x="548" y="504" class="mono-small" text-anchor="middle">
    <tspan x="548" dy="0">CandidateSet +</tspan>
    <tspan x="548" dy="16">default</tspan>
  </text>

  <path d="M474,590 L1322,590" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <text x="898" y="562" class="mono-green" text-anchor="middle">
    <tspan x="898" dy="0">write PendingAction</tspan>
    <tspan x="898" dy="16">or PlanSnapshot</tspan>
  </text>

  <path d="M474,646 L976,646" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <text x="725" y="620" class="mono-green" text-anchor="middle">run confirmed Plan</text>

  <path d="M1012,700 L1156,700" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <text x="1084" y="674" class="mono-green" text-anchor="middle">execute PlanStep</text>

  <path d="M1156,754 L1012,754" fill="none" stroke="#7c838d" stroke-width="2.1" marker-end="url(#arrow-gray)"/>
  <text x="1084" y="728" class="mono-small" text-anchor="middle">StepResult</text>

  <path d="M1012,808 L1322,808" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <text x="1167" y="780" class="mono-green" text-anchor="middle">
    <tspan x="1167" dy="0">persist StepResult</tspan>
    <tspan x="1167" dy="16">+ metrics</tspan>
  </text>

  <path d="M1012,862 L1322,862" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <text x="1167" y="836" class="mono-green" text-anchor="middle">
    <tspan x="1167" dy="0">pre/post safety</tspan>
    <tspan x="1167" dy="16">check</tspan>
  </text>

  <rect x="420" y="888" width="952" height="120" rx="14" fill="#fbfff7" stroke="#6fb23f" stroke-width="1.4"/>
  <rect x="420" y="888" width="952" height="120" rx="14" fill="url(#dots-green)" opacity="0.22"/>
  <rect x="420" y="888" width="98" height="36" rx="10" fill="#ffffff" stroke="#6fb23f" stroke-width="1.4"/>
  <text x="469" y="910" class="lane" text-anchor="middle">LOOP</text>
  <text x="1084" y="910" class="mono-small" text-anchor="middle">retry -&gt; patch -&gt; replan</text>
  <text x="1084" y="928" class="mono-small" text-anchor="middle">until RUNNING resumes or recovery is exhausted</text>
  <text x="898" y="858" class="mono-small" text-anchor="middle">ok / warn / block</text>
  <path d="M1322,912 L474,912" fill="none" stroke="#7c838d" stroke-width="2.1" marker-end="url(#arrow-gray)"/>
  <path d="M474,966 L622,966" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <text x="548" y="940" class="mono-green" text-anchor="middle">
    <tspan x="548" dy="0">patch or suffix replan</tspan>
    <tspan x="548" dy="16">request</tspan>
  </text>
  <path d="M640,1004 L456,1004" fill="none" stroke="#6fb23f" stroke-width="2.1" marker-end="url(#arrow-green)"/>
  <text x="548" y="978" class="mono-green" text-anchor="middle">
    <tspan x="548" dy="0">Decision applied</tspan>
    <tspan x="548" dy="16">returns control</tspan>
  </text>
  <text x="86" y="1048" class="mono-small" text-anchor="start">WAITING_* gates are persisted before the user sees the decision.</text>
  <text x="816" y="1048" class="mono-small" text-anchor="start">Safety block maps to WAITING_REPLAN_CONFIRM, not hidden execution.</text>
</svg>
